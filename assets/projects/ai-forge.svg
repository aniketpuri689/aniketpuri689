<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210">
  <defs>
    <filter id="forgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes codeStream {
      0% { transform: translateY(0px); opacity: 0.8; }
      50% { transform: translateY(-35px); opacity: 0.3; }
      100% { transform: translateY(0px); opacity: 0.8; }
    }
    .stream-layer {
      animation: codeStream 3.5s ease-in-out infinite;
    }
    @keyframes bytePulse {
      0% { fill: #00f0ff; }
      50% { fill: #38bdf8; }
      100% { fill: #00f0ff; }
    }
    .byte-dot {
      animation: bytePulse 1.6s ease-in-out infinite;
    }
  </style>

  <!-- Card Backplate -->
  <rect x="2" y="2" width="956" height="206" rx="8" fill="url(#cardBg)" stroke="#00f0ff" stroke-width="1.2" filter="url(#forgeGlow)"/>

  <!-- Tactical Header Tag -->
  <rect x="24" y="20" width="235" height="22" rx="4" fill="#083344" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="34" y="35" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#00f0ff" letter-spacing="0.08em">FULL-STACK WEB // CLIENT ENGINE</text>

  <!-- Live Status Badge -->
  <circle cx="890" cy="31" r="4" fill="#10b981"/>
  <text x="902" y="35" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#10b981">BUNDLE: &lt;25KB RAW</text>

  <!-- Project Title -->
  <text x="24" y="68" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.02em">AI Forge — Collaborative Developer &amp; Learning Platform</text>

  <!-- Project Description -->
  <text x="24" y="92" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#a1a1aa">
    Architected a full-stack educational web platform engineered for students and peer engineers.
  </text>
  <text x="24" y="110" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#a1a1aa">
    Features in-browser code practice sandboxes, dynamic quiz engines, hackathon telemetry, and zero-overhead client persistence.
  </text>

  <!-- Animated Code Execution & State Engine Terminal -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="370" height="96" rx="6" fill="#050505" stroke="#27272a" stroke-width="1"/>

    <!-- Terminal Top Bar -->
    <rect x="0" y="0" width="370" height="20" rx="6" fill="#18181b"/>
    <circle cx="14" cy="10" r="3" fill="#ef4444"/>
    <circle cx="26" cy="10" r="3" fill="#f59e0b"/>
    <circle cx="38" cy="10" r="3" fill="#10b981"/>
    <text x="54" y="14" font-family="JetBrains Mono, monospace" font-size="9" fill="#71717a">compiler://sandbox.exec</text>

    <!-- Animated Code Streaming Lines -->
    <g transform="translate(16, 36)" class="stream-layer" font-family="JetBrains Mono, monospace" font-size="9">
      <text x="0" y="0" fill="#00f0ff">&gt; import { useNeuralEngine } from "@forge/core"</text>
      <text x="0" y="15" fill="#a1a1aa">&gt; const runtime = initSandbox({ maxHeap: "64MB" })</text>
      <text x="0" y="30" fill="#10b981">&gt; STATUS: 200 OK // 0.04ms compile</text>
      <text x="0" y="45" fill="#38bdf8">&gt; persistentState: synchronized</text>
    </g>

    <circle cx="355" cy="80" r="4" fill="#00f0ff" class="byte-dot"/>
  </g>

  <!-- Bottom Metric Tags -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="115" height="26" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="57" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#f4f4f5">NEXT.JS 15</text>

    <rect x="125" y="0" width="105" height="26" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="177" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#f4f4f5">REACT 19</text>

    <rect x="240" y="0" width="115" height="26" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="297" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#f4f4f5">TYPESCRIPT</text>

    <rect x="365" y="0" width="135" height="26" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="432" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#f4f4f5">TAILWIND CSS</text>
  </g>

  <!-- View Repository Action Callout -->
  <text x="936" y="184" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#00f0ff">LAUNCH PLATFORM ➔</text>
</svg>