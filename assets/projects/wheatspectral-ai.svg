<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210">
  <defs>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 12px; opacity: 0.8; }
      100% { r: 38px; opacity: 0.0; }
    }
    .radar-wave {
      animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .radar-wave-delay {
      animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s infinite;
    }
  </style>

  <!-- Card Backplate with Glowing Cyan Border -->
  <rect x="2" y="2" width="956" height="206" rx="8" fill="url(#cardBg)" stroke="#00f0ff" stroke-width="1.2" filter="url(#cardGlow)"/>

  <!-- Tactical Header Tag -->
  <rect x="24" y="20" width="220" height="22" rx="4" fill="#083344" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="34" y="35" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#00f0ff" letter-spacing="0.08em">VOICE AI // HYPERSPECTRAL ML</text>

  <!-- Live Status Badge -->
  <circle cx="890" cy="31" r="4" fill="#10b981"/>
  <text x="902" y="35" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#10b981">ACCURACY: 96.4%</text>

  <!-- Project Title -->
  <text x="24" y="68" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.02em">WheatSpectral AI — Hyperspectral Crop Intelligence</text>

  <!-- Project Description -->
  <text x="24" y="92" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#a1a1aa">
    Integrated conversational Voice AI into a hyperspectral image processing pipeline trained to evaluate crop health.
  </text>
  <text x="24" y="110" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#a1a1aa">
    Enabled farmers to query 224-channel spectral ML predictions and diagnostic telemetry using real-time voice commands.
  </text>

